name: daily-crawl

on:
  schedule:
    # UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r policy-crawler/requirements.txt

      - name: 运行爬虫并合并输出 data/policies.json
        run: |
          set -x
          FAILED=""
          python policy-crawler/main.py crawl --source nmpa --days 1 --output data/policies.json \
            || { echo "::warning::NMPA 抓取失败，最近日志如下"; tail -n 60 logs/crawler.log 2>/dev/null || true; FAILED="$FAILED nmpa"; }
          python policy-crawler/main.py crawl --source nhsa --days 1 --output data/policies.json \
            || { echo "::warning::NHSA 抓取失败，最近日志如下"; tail -n 60 logs/crawler.log 2>/dev/null || true; FAILED="$FAILED nhsa"; }
          python policy-crawler/main.py crawl --source nhc --days 1 --output data/policies.json \
            || { echo "::warning::NHC 抓取失败，最近日志如下"; tail -n 60 logs/crawler.log 2>/dev/null || true; FAILED="$FAILED nhc"; }
          if [ "$FAILED" = " nmpa nhsa nhc" ]; then
            echo "::error::三个数据源全部抓取失败，请检查上方日志"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::notice::部分来源抓取失败:$FAILED，其余来源数据已提交"
          fi

      - name: 校验产物结构
        run: |
          python - <<'PY'
          import json
          data = json.load(open("data/policies.json", encoding="utf-8"))
          assert isinstance(data, list), "data/policies.json 必须是 JSON 数组"
          required = {"id", "title", "url", "publish_date",
                      "content_preview", "source_site", "created_at"}
          for row in data[:100]:
              missing = required - set(row)
              assert not missing, f"字段缺失: {missing} -> {row.get('url')}"
          print(f"policies: {len(data)} 条，schema OK")
          PY

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policies.json
          if git diff --cached --quiet; then
            echo "data/policies.json 无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto-update policy data [skip ci]"
          git push
